name: Render website

on: [push, pull_request]

jobs:
  upload:
    runs-on: Ubuntu-latest
    container: ghcr.io/uofuepibio/phs7045-advanced-programming:fall2024

    steps:
      - uses: actions/checkout@v4

      # The :fall2024 image predates several packages the book now needs, and
      # nothing in this repo rebuilds it. Install whatever is missing so a
      # stale image cannot break the render.
      - name: Install packages missing from the container image
        run: |
          Rscript -e '
            pkgs <- c("dplyr", "gapminder", "purrr", "rvest", "xml2", "usethis")
            missing <- setdiff(pkgs, rownames(installed.packages()))
            if (length(missing)) {
              cran <- getOption("repos")["CRAN"]
              if (is.na(cran) || !nzchar(cran) || cran == "@CRAN@") {
                options(repos = c(CRAN = "https://cloud.r-project.org"))
              }
              message("Installing: ", paste(missing, collapse = ", "))
              install.packages(missing)
            } else {
              message("Nothing to install.")
            }
          '

      # 01-git/quarto.qmd has one Python chunk (stdlib only). reticulate embeds Python, so it needs libpython, not
      # just the interpreter. RETICULATE_PYTHON skips virtualenv discovery.
      - name: Provide Python for the reticulate demo chunk
        run: |
          set -eu
          if ! ldconfig -p | grep -q 'libpython3\..*\.so'; then
            apt-get update
            apt-get install -y --no-install-recommends python3 libpython3-dev
          fi
          echo "RETICULATE_PYTHON=$(command -v python3)" >> "$GITHUB_ENV"
          python3 --version

      - name: Render Quarto book
        run: quarto render

      - uses: actions/upload-pages-artifact@v3
        with:
          path: "./_book"

  website:
    if: ${{ github.event_name != 'pull_request' }}
    needs: upload
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to GitHub pages
        uses: actions/deploy-pages@v4

      
