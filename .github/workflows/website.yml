name: Render website

on: [push, pull_request]

jobs:
  upload:
    runs-on: Ubuntu-latest
    container: ghcr.io/uofuepibio/phs7045-advanced-programming:fall2024

    steps:
      - uses: actions/checkout@v4

      - name: Render Quarto book
        run: quarto render

      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: "./_book"

  post-artifact:
    if: ${{ github.event_name == 'pull_request' }}
    needs: upload
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write

    steps:
      - name: Post rendered website artifact
        uses: CDCgov/cfa-actions/post-artifact@1.2.0
        with:
          artifact-name: github-pages
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          message: "The rendered website for this pull request is ready: [download { artifact-name }]({ artifact-url })."

  website:
    if: ${{ github.event_name != 'pull_request' }}
    needs: upload
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to GitHub pages
        id: deployment
        uses: actions/deploy-pages@v4
