name: Render website

on: [push, pull_request]

jobs:
  upload:
    runs-on: Ubuntu-latest
    container: ghcr.io/uofuepibio/phs7045-advanced-programming:latest

    steps:
      - uses: actions/checkout@v4

      - name: Render Quarto book
        run: quarto render

      - name: Upload rendered website for the pull request
        if: ${{ github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          path: "./_book"
          name: rendered-website

      - name: Upload GitHub Pages deployment artifact
        if: ${{ github.event_name == 'push' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./_book"

  post-artifact:
    if: ${{ github.event_name == 'pull_request' }}
    needs: upload
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pull-requests: write

    steps:
      - name: Post rendered website artifact
        uses: CDCgov/cfa-actions/post-artifact@v1.6.0
        with:
          artifact-name: rendered-website
          gh-token: ${{ secrets.GITHUB_TOKEN }}
          message: "The rendered website for this pull request is ready: [download { artifact-name }]({ artifact-url })."

  deploy:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: upload
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to GitHub pages
        id: deployment
        uses: actions/deploy-pages@v4
